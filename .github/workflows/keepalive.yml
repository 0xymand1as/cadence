name: keepalive

# Pings the live app every 5 min so Render's free tier never idles into a
# cold start (it sleeps after ~15 min of no traffic). A failed ping also
# surfaces as a failed Action run = a free uptime alarm.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://cadence.biggerdreamsco.com/health; then
              echo "ok"; exit 0
            fi
            echo "retry $i after cold start..."; sleep 15
          done
          echo "health check failed"; exit 1
