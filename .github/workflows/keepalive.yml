name: keepalive

# Keeps the Render free instance warm so the TikTok reviewer (and real users)
# never hit a ~50s cold start. GitHub's cron can be delayed, so each run
# self-pings every 60s for ~14 minutes; with a */5 trigger the runs overlap
# into continuous coverage (Render sleeps only after ~15 min idle).
# Public repo => unlimited Actions minutes, so this is free.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false   # let runs overlap for redundancy

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Cadence warm
        run: |
          for i in $(seq 1 14); do
            if curl -fsS --max-time 60 https://cadence.biggerdreamsco.com/health; then
              echo " ping $i ok"
            else
              echo " ping $i failed"
            fi
            sleep 60
          done
