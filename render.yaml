services:
  - type: web
    name: cadence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: TIKTOK_CLIENT_KEY
        sync: false          # paste in Render dashboard — do not commit
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        value: https://cadence.biggerdreamsco.com/callback
      - key: FLASK_SECRET
        generateValue: true
      - key: R2_ENDPOINT_URL
        sync: false          # https://<accountid>.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false          # R2 API token scoped to the videos bucket only
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: videos
